<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suwan Smart Learner | สังคมศึกษา สค21001</title>
  <style>
    /* ตั้งค่าให้หน้าเว็บเต็มจอ 100% ไม่มีขอบขาว */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden; /* ซ่อนแถบเลื่อนของหน้าเว็บหลัก */
      background-color: #f1f5f9; /* สีพื้นหลัง */
    }
    /* ตั้งค่าตัวกรอบ iframe ให้เต็มจอพอดี */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- นำลิงก์ Google Apps Script ของคุณมาฝังไว้ตรงนี้ -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyeQlIqTGZeOfcIaxbkb12dO_81r8PQwPpKgxxYtJs7FGTdcsbyU_4gZEGxltT3cJhd/exec" 
    allow="geolocation; microphone; camera; clipboard-write;"
    sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals">
  </iframe>

</body>
</html>
